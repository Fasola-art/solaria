# 다중 매칭 규칙
# - 같은 프롬프트에서 여러 Role 매칭 시 priority_order 순서대로 1개만 주 Role 선택
# - 나머지는 협업 Role로 참여 (최대 3개 동시 활성)
# - force_trigger 키워드 감지 시 Security Eng 무조건 참여 (주 Role 수에 포함)
# - 500줄 이상 PR → /codex-route 자동 추가

force_security_with:
  - auth
  - payment
  - admin
  - secret
  - token
  - credential

checkpoint_map:
  SILENT:
    - pr_review
    - log_analysis
    - test_result_report
    - devdep_add
    - feature_flag_toggle
    - rollback
  INFORM_5m:
    - code_modify
    - deploy_any_env
    - ci_change
    - prod_dep_add
  GATE_1h:
    - hotfix_prod_merge
  GATE_24h:
    - db_migration_destructive
    - secret_rotate
    - force_push
