# 교차검증 규칙
# v3.0 - 품질 보증 시스템 (Forrester Wave 방식)

version: "3.0"
description: "최소 2개 소스 일치 확인을 통한 사실 검증 규칙"

# 핵심 원칙
principles:
  - name: "Multi-Source Verification"
    description: "중요 주장은 최소 2개 이상 소스에서 확인"

  - name: "Source Independence"
    description: "서로 독립적인 소스에서 확인"

  - name: "Conflict Transparency"
    description: "소스 간 충돌은 투명하게 표시"

# 검증 레벨 정의
verification_levels:
  level_3:
    name: "높은 신뢰"
    label: "✅"
    criteria:
      min_sources: 3
      source_independence: true
      source_quality: "tier_1 또는 tier_2"
    description: "3개 이상 독립 소스에서 확인됨"

  level_2:
    name: "중간 신뢰"
    label: "🟢"
    criteria:
      min_sources: 2
      source_independence: true
      source_quality: "tier_1 또는 tier_2"
    description: "2개 독립 소스에서 확인됨"

  level_1:
    name: "단일 소스"
    label: "🟡"
    criteria:
      min_sources: 1
      source_quality: "tier_1"
    description: "신뢰할 수 있는 단일 소스"

  level_0:
    name: "미검증"
    label: "⚠️"
    criteria:
      min_sources: 0
    description: "검증되지 않은 정보"

  conflict:
    name: "소스 충돌"
    label: "⚔️"
    criteria:
      conflicting_sources: true
    description: "소스 간 정보가 상충됨"

# 교차검증 필수 대상
mandatory_verification:
  always_verify:
    - type: "statistics"
      description: "통계 수치"
      example: "시장 규모, 성장률, 점유율"
      min_level: "level_2"

    - type: "predictions"
      description: "예측/전망"
      example: "시장 전망, 기술 예측"
      min_level: "level_2"

    - type: "company_info"
      description: "기업 정보"
      example: "펀딩 금액, 직원 수, 매출"
      min_level: "level_2"

    - type: "scientific_claims"
      description: "과학적 주장"
      example: "효과, 부작용, 연구 결과"
      min_level: "level_3"  # 더 엄격

    - type: "legal_interpretations"
      description: "법률 해석"
      example: "판례 해석, 법률 적용"
      min_level: "level_2"

  skip_verification:
    - type: "common_knowledge"
      description: "상식적 정보"

    - type: "official_announcements"
      description: "공식 발표 (원문 인용)"

    - type: "definitions"
      description: "용어 정의"

# 소스 독립성 판단
source_independence:
  independent:
    - "서로 다른 조직에서 발행"
    - "서로 다른 연구자/저자"
    - "서로 다른 데이터 소스 사용"

  not_independent:
    - "동일 보도자료 기반 기사들"
    - "원본을 재인용한 2차 자료"
    - "같은 기관의 다른 문서"
    - "자동 생성된 요약/번역본"

  verification:
    check_items:
      - "원본 출처가 다른가?"
      - "데이터 수집 시점이 다른가?"
      - "분석 방법이 다른가?"

# 충돌 처리 규칙
conflict_resolution:
  detection:
    triggers:
      - "숫자 불일치 (10% 이상 차이)"
      - "결론 불일치"
      - "시점 불일치"

  handling:
    minor_conflict:
      description: "경미한 불일치 (10-20% 차이)"
      action: "범위로 표시"
      template: "{value1}~{value2} (소스별 차이)"

    major_conflict:
      description: "심각한 불일치 (20% 이상 또는 결론 상반)"
      action: "양측 모두 제시"
      template: |
        ⚔️ **소스 간 상충**
        - 소스 A ({source_a}): {claim_a}
        - 소스 B ({source_b}): {claim_b}
        *추가 확인 권장*

    irreconcilable:
      description: "해결 불가 충돌"
      action: "결론 유보"
      template: |
        ⚠️ **결론 유보**
        신뢰할 수 있는 소스 간 상반된 정보가 있어
        확정적 결론을 내리기 어렵습니다.

        {conflict_details}

# 분야별 검증 강도
domain_verification:
  high_rigor:
    domains:
      - health_medical
      - legal
      - stocks_finance
    requirements:
      min_sources: 2
      source_quality: "tier_1 필수"
      conflict_tolerance: "low"

  medium_rigor:
    domains:
      - real_estate
      - startup_business
      - crypto_blockchain
    requirements:
      min_sources: 2
      source_quality: "tier_1 또는 tier_2"
      conflict_tolerance: "medium"

  standard_rigor:
    domains:
      - ai_technology
      - education_learning
      - travel_food
      - shopping_reviews
    requirements:
      min_sources: 1
      source_quality: "tier_1 또는 tier_2"
      conflict_tolerance: "high"

# 검증 프로세스
verification_process:
  steps:
    1_identify_claims:
      action: "검증 필요한 주장 식별"
      criteria: "mandatory_verification 목록 참조"

    2_collect_sources:
      action: "각 주장에 대한 소스 수집"
      min_count: 2

    3_check_independence:
      action: "소스 간 독립성 확인"
      criteria: "source_independence 규칙 적용"

    4_compare_claims:
      action: "소스 간 주장 비교"
      detect: "일치/불일치/충돌"

    5_assign_level:
      action: "검증 레벨 할당"
      based_on: "verification_levels"

    6_handle_conflicts:
      action: "충돌 처리"
      based_on: "conflict_resolution"

# 출력 템플릿
output_templates:
  verified_claim: |
    {claim} ✅
    *{source_count}개 소스에서 확인됨*

  partially_verified: |
    {claim} 🟡
    *단일 소스 ({source_name})*

  unverified_claim: |
    {claim} ⚠️
    *검증되지 않음 - 추가 확인 필요*

  conflicting_claim: |
    ⚔️ **소스 간 상충 발견**

    | 소스 | 주장 |
    |------|------|
    | {source_1} | {claim_1} |
    | {source_2} | {claim_2} |

    *확정적 결론 어려움, 추가 확인 권장*

  verification_summary: |
    ### 🔍 교차검증 요약

    | 레벨 | 개수 | 설명 |
    |------|------|------|
    | ✅ 높은 신뢰 | {level_3_count} | 3+ 소스 확인 |
    | 🟢 중간 신뢰 | {level_2_count} | 2 소스 확인 |
    | 🟡 단일 소스 | {level_1_count} | 1 소스 |
    | ⚠️ 미검증 | {level_0_count} | 확인 필요 |
    | ⚔️ 충돌 | {conflict_count} | 소스 상충 |

# 에이전트 적용
agent_application:
  analyzer:
    role: "소스별 주장 추출 및 비교"
    actions:
      - "핵심 주장 추출"
      - "소스 간 주장 대조"
      - "일치/불일치 식별"
      - "충돌 감지"

  synthesizer:
    role: "검증 레벨 기반 결론 도출"
    actions:
      - "검증 레벨 할당"
      - "충돌 처리"
      - "검증 요약 생성"
      - "미검증 정보 표시"
