# 정보 최신성 정책
# v3.0 - 품질 보증 시스템

version: "3.0"
description: "분야별 정보 유효 기간 및 최신성 검증 규칙"

# 핵심 원칙
principles:
  - name: "Domain-Specific Freshness"
    description: "분야마다 정보의 유효 기간이 다름"

  - name: "Explicit Dating"
    description: "모든 정보에 날짜 표시 필수"

  - name: "Staleness Warning"
    description: "오래된 정보는 경고 표시"

# 분야별 최신성 기준
freshness_thresholds:
  # 실시간/초단기 (1주 이내)
  real_time:
    domains:
      - crypto_blockchain
      - stocks_finance  # 시세 정보
    max_age_days: 7
    warning_after_days: 3
    rationale: "시세와 암호화폐는 급변하므로 최신 정보 필수"

  # 단기 (1개월 이내)
  short_term:
    domains:
      - real_estate  # 시세 정보
      - news
      - travel_food  # 리뷰, 영업 정보
    max_age_days: 30
    warning_after_days: 14
    rationale: "부동산 시세, 뉴스, 맛집 정보는 빠르게 변함"

  # 중기 (6개월 이내)
  medium_term:
    domains:
      - startup_business  # 펀딩, 밸류에이션
      - career_jobs  # 채용 정보
      - shopping_reviews  # 제품 리뷰
      - environment_esg
    max_age_days: 180
    warning_after_days: 90
    rationale: "비즈니스 환경은 반기 단위로 변화"

  # 장기 (1년 이내)
  long_term:
    domains:
      - ai_technology
      - education_learning
      - legal  # 판례, 해석
    max_age_days: 365
    warning_after_days: 180
    rationale: "기술과 법률은 연 단위로 업데이트"

  # 초장기 (5년 이내)
  very_long_term:
    domains:
      - health_medical  # 학술 연구
      - academic_papers
    max_age_days: 1825  # 5년
    warning_after_days: 1095  # 3년
    rationale: "학술 연구는 검증에 시간이 필요"

  # 기본값
  default:
    domains:
      - general
    max_age_days: 365
    warning_after_days: 180

# 최신성 상태 정의
freshness_status:
  fresh:
    label: "🟢 최신"
    description: "유효 기간 내 정보"
    action: "정상 인용"

  aging:
    label: "🟡 경고"
    description: "경고 기간 초과"
    action: "날짜 표시 + 최신 정보 확인 권장"

  stale:
    label: "🔴 오래됨"
    description: "유효 기간 초과"
    action: "경고 표시 + 최신 정보로 대체 시도"

  unknown:
    label: "⚪ 날짜 불명"
    description: "날짜 정보 없음"
    action: "날짜 불명 표시 + 교차검증 필요"

# 날짜 추출 규칙
date_extraction:
  sources:
    - "페이지 내 발행일"
    - "URL 내 날짜 패턴"
    - "메타데이터 (og:article:published_time)"
    - "저작권 연도"
    - "마지막 수정일"

  fallback:
    no_date_found: "날짜 불명으로 표시"
    multiple_dates: "가장 최근 날짜 사용"

# 분야별 특수 규칙
special_rules:
  stocks_finance:
    # 주식 정보는 시점이 매우 중요
    requirements:
      - "시세 데이터: 실시간 또는 장 마감 시점 명시"
      - "재무제표: 분기/연도 명시"
      - "애널리스트 리포트: 발행일 필수"
    stale_action: "오래된 시세는 절대 인용 금지"

  health_medical:
    # 의료 정보는 최신 가이드라인 확인 필요
    requirements:
      - "연구 발표 연도 필수"
      - "최신 가이드라인 우선"
      - "오래된 연구는 '당시 기준' 표시"
    stale_action: "최신 연구/가이드라인 추가 검색"

  legal:
    # 법률은 개정 여부 확인 필수
    requirements:
      - "법령 시행일 확인"
      - "개정 여부 확인"
      - "판례 선고일 표시"
    stale_action: "현행 법률 확인 권고"

  real_estate:
    # 부동산은 시세 변동이 빠름
    requirements:
      - "시세 기준일 필수"
      - "분양가/실거래가 구분"
      - "KB/부동산114 기준 명시"
    stale_action: "최신 시세 확인 권고"

# 검증 프로세스
validation_process:
  steps:
    1_extract_date:
      action: "소스에서 날짜 추출"
      fallback: "날짜 불명 표시"

    2_determine_domain:
      action: "분야 판별"
      fallback: "기본값 적용"

    3_calculate_age:
      action: "현재 날짜와 비교하여 경과일 계산"

    4_assign_status:
      action: "freshness_status 할당"

    5_apply_action:
      action: "상태에 따른 조치 수행"

# 출력 템플릿
output_templates:
  fresh_info: |
    {content} ([{source}]({url}), {date})

  aging_info: |
    {content} ([{source}]({url}), {date})
    *🟡 {age_days}일 전 정보 - 최신 정보 확인 권장*

  stale_info: |
    {content} ([{source}]({url}), {date})
    *🔴 {age_days}일 전 정보 - 현재 상황과 다를 수 있음*

  unknown_date_info: |
    {content} ([{source}]({url}))
    *⚪ 날짜 불명 - 최신 정보 확인 권장*

  freshness_summary: |
    ### 📅 정보 최신성 요약

    | 상태 | 개수 | 설명 |
    |------|------|------|
    | 🟢 최신 | {fresh_count} | 유효 기간 내 |
    | 🟡 경고 | {aging_count} | 확인 권장 |
    | 🔴 오래됨 | {stale_count} | 주의 필요 |
    | ⚪ 날짜 불명 | {unknown_count} | 검증 필요 |

    *이 리서치의 기준일: {research_date}*

# 에이전트 적용
agent_application:
  analyzer:
    role: "날짜 추출 및 상태 할당"
    actions:
      - "각 소스에서 날짜 추출"
      - "분야별 기준 적용"
      - "freshness_status 태깅"

  synthesizer:
    role: "최신성 기반 정보 필터링"
    actions:
      - "stale 정보 우선순위 하향"
      - "fresh 정보 중심 결론 도출"
      - "최신성 요약 표시"
