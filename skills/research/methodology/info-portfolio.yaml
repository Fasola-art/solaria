# BCG 정보 포트폴리오 방법론
# v3.0 - 전문 리서치 회사 방법론 통합

methodology:
  name: "Information Portfolio Matrix"
  source: "BCG (Boston Consulting Group)"
  description: "정보의 성장 잠재력과 현재 가치로 분류하는 프레임워크"

# 정보 분류 매트릭스
info_matrix:
  x_axis:
    name: "현재 가치 (Current Value)"
    description: "정보의 현재 신뢰도와 검증 수준"
    scale: [1, 5]
    criteria:
      low: "신뢰도 낮음, 미검증"
      high: "신뢰도 높음, 검증됨"

  y_axis:
    name: "성장 잠재력 (Growth Potential)"
    description: "정보의 최신성과 발전 가능성"
    scale: [1, 5]
    criteria:
      low: "오래된 정보, 변화 없음"
      high: "최신 정보, 발전 중"

  quadrants:
    star:
      position: "높은 성장 잠재력 + 높은 현재 가치"
      meaning: "최신 + 신뢰도 높음"
      action: "핵심 결론에 사용"
      label: "⭐ Star"

    question_mark:
      position: "높은 성장 잠재력 + 낮은 현재 가치"
      meaning: "최신 + 신뢰도 낮음"
      action: "교차검증 필요, '확인 필요' 표시"
      label: "❓ Question Mark"

    cash_cow:
      position: "낮은 성장 잠재력 + 높은 현재 가치"
      meaning: "오래됨 + 신뢰도 높음"
      action: "배경 설명에 사용"
      label: "🐄 Cash Cow"

    dog:
      position: "낮은 성장 잠재력 + 낮은 현재 가치"
      meaning: "오래됨 + 신뢰도 낮음"
      action: "제외"
      label: "🐕 Dog"

# 시각화 템플릿
visualization:
  matrix:
    - "Y축: 성장 잠재력(최신성)"
    - "상단-우측: Star = 최신 + 신뢰도 높음"
    - "상단-좌측: Question Mark = 최신 + 신뢰도 낮음"
    - "하단-우측: Cash Cow = 오래됐지만 검증됨"
    - "하단-좌측: Dog = 오래되고 신뢰도 낮음"
    - "X축: 현재 가치(신뢰도)"

  legend:
    - "Star: 핵심 결론 - 최신 + 높은 신뢰도"
    - "Question Mark: 교차검증 - 최신 + 낮은 신뢰도"
    - "Cash Cow: 배경 정보 - 검증됨 + 오래됨"
    - "Dog: 제외 - 오래됨 + 낮은 신뢰도"

# 결론 성숙도 평가
maturity_assessment:
  description: "결론의 확신도 평가 프레임워크"

  levels:
    definitive:
      label: "✅ Definitive"
      confidence: "90-100%"
      criteria:
        - "신뢰도 4+ 소스 3개 이상"
        - "소스 간 일관성 높음"
        - "반박 증거 없음"
      display: "높은 확신으로 결론 가능"

    high:
      label: "🟢 High"
      confidence: "70-89%"
      criteria:
        - "신뢰도 4+ 소스 2개 이상"
        - "경미한 불일치 존재"
        - "반박 증거 약함"
      display: "높은 확신, 일부 불확실성"

    emerging:
      label: "🟡 Emerging"
      confidence: "40-69%"
      criteria:
        - "신뢰도 3+ 소스 존재"
        - "일부 불확실성"
        - "추가 검증 권장"
      display: "중간 확신, 추가 검증 필요"

    low:
      label: "🔴 Low"
      confidence: "0-39%"
      criteria:
        - "소스 부족"
        - "소스 간 상충"
        - "검증 불가"
      display: "낮은 확신, 결론 유보"

# 증거 통합 프로세스
evidence_synthesis:
  steps:
    1_collect:
      name: "증거 수집"
      description: "모든 소스의 핵심 주장 추출"
      output: "주장 목록"

    2_categorize:
      name: "증거 분류"
      description: "BCG 매트릭스로 분류"
      output: "분류된 증거"

    3_weight:
      name: "가중치 부여"
      description: "Star > Cash Cow > Question Mark"
      output: "가중 증거"

    4_synthesize:
      name: "종합"
      description: "가중 증거 통합"
      output: "종합 결론"

    5_assess:
      name: "성숙도 평가"
      description: "결론 확신도 판정"
      output: "성숙도 레벨"

# Research Skill 적용
application:
  analyzer_agent:
    role: "정보 분류"
    actions:
      - "각 소스 최신성 평가"
      - "각 소스 신뢰도 평가"
      - "BCG 매트릭스 분류"

  synthesizer_agent:
    role: "증거 통합 및 성숙도 평가"
    actions:
      - "Star 정보 중심 결론"
      - "Question Mark 교차검증"
      - "Cash Cow 배경 활용"
      - "성숙도 레벨 판정"

# 출력 형식
output_format:
  evidence_matrix:
    columns:
      - "정보/소스"
      - "최신성 (1-5)"
      - "신뢰도 (1-5)"
      - "분류"
      - "활용"

  conclusion_assessment:
    sections:
      - "핵심 결론"
      - "성숙도 레벨"
      - "확신도 (%)"
      - "근거 (Star 소스)"
      - "불확실성 (Question Mark)"
      - "추가 조사 권장 사항"

  template: |
    ## 결론 평가

    **결론**: {conclusion_text}

    **성숙도**: {maturity_level}
    **확신도**: {confidence}%

    ### 근거
    | 소스 | 분류 | 핵심 주장 |
    |------|------|----------|
    {evidence_table}

    ### 불확실성
    {uncertainties}

    ### 추가 조사 필요
    {recommendations}
