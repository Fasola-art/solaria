# Market Research 인터뷰 템플릿
# 시장 조사를 위한 맞춤형 질문

template:
  name: market_research
  description: "시장 조사/시장 분석을 위한 인터뷰 템플릿"
  trigger_keywords:
    - "시장"
    - "market"
    - "TAM"
    - "SAM"
    - "규모"
    - "성장률"
    - "동향"
    - "트렌드"

# 핵심 질문
questions:
  # Q1: 지역/시장 범위
  scope:
    question: "어떤 지역/시장에 집중할까요?"
    category: "scope"
    priority: high
    options:
      - label: "글로벌"
        description: "전 세계 시장 분석"
        search_modifier: "global market"
      - label: "북미"
        description: "미국, 캐나다 중심"
        search_modifier: "North America market"
      - label: "아시아 (한국 포함)"
        description: "한국, 일본, 중국 등"
        search_modifier: "Asia Pacific market Korea"
      - label: "유럽"
        description: "EU 및 영국 시장"
        search_modifier: "Europe market"

  # Q2: 리서치 목적
  purpose:
    question: "이 리서치의 목적은?"
    category: "purpose"
    priority: high
    options:
      - label: "시장 진입 검토"
        description: "새로운 시장 진출 가능성 평가"
        output_format: "market_entry_report"
        focus_areas:
          - "시장 규모"
          - "진입 장벽"
          - "경쟁 현황"
          - "규제 환경"
      - label: "경쟁 분석"
        description: "주요 경쟁사 파악 및 비교"
        output_format: "competitive_landscape"
        focus_areas:
          - "주요 플레이어"
          - "시장 점유율"
          - "차별화 포인트"
      - label: "투자 판단"
        description: "투자 결정을 위한 시장 분석"
        output_format: "investment_analysis"
        focus_areas:
          - "성장 잠재력"
          - "리스크 요인"
          - "밸류에이션"
      - label: "일반 학습"
        description: "시장에 대한 전반적 이해"
        output_format: "market_overview"
        focus_areas:
          - "시장 개요"
          - "주요 트렌드"
          - "미래 전망"

  # Q3: 시간 범위
  time_range:
    question: "어떤 시간 범위를 분석할까요?"
    category: "scope"
    priority: medium
    options:
      - label: "현재 (2024-2025)"
        description: "현재 시장 상황"
        search_modifier: "2024 2025"
      - label: "단기 전망 (1-2년)"
        description: "가까운 미래 예측"
        search_modifier: "forecast 2025 2026"
      - label: "중기 전망 (3-5년)"
        description: "중기 시장 전망"
        search_modifier: "outlook 2027 2028 2029"
      - label: "장기 전망 (5년+)"
        description: "장기 트렌드 및 변화"
        search_modifier: "long term forecast 2030"

  # Q4: 분석 깊이
  depth:
    question: "어떤 깊이의 분석을 원하시나요?"
    category: "depth"
    priority: medium
    options:
      - label: "개요/트렌드"
        description: "핵심 지표와 트렌드 파악 (5분)"
        depth_level: "quick"
        max_sources: 10
      - label: "상세 분석"
        description: "세그먼트별 분석 포함 (15분)"
        depth_level: "standard"
        max_sources: 30
      - label: "심층 리서치"
        description: "상세 데이터와 예측 (30분+)"
        depth_level: "deep"
        max_sources: 50

  # Q5: 특정 세그먼트 (선택적)
  segment:
    question: "특정 세그먼트에 집중할까요?"
    category: "keywords"
    priority: low
    conditional: true
    show_if: "purpose in ['시장 진입 검토', '투자 판단']"
    type: "open_ended"
    placeholder: "예: B2B SaaS, 엔터프라이즈, SMB 등"

# 기본값 (응답 없을 시)
defaults:
  scope: "글로벌"
  purpose: "일반 학습"
  time_range: "현재 (2024-2025)"
  depth: "상세 분석"

# 컨텍스트 템플릿
context_template: |
  이해한 내용:
  - 주제: {topic} 시장 분석
  - 지역: {scope}
  - 목적: {purpose}
  - 시간 범위: {time_range}
  - 분석 깊이: {depth}
  {segment_line}

  맞으시면 진행하겠습니다.

# 검색 전략 매핑
search_strategy:
  base_queries:
    - "{topic} market size {year}"
    - "{topic} market growth CAGR"
    - "{topic} industry trends"
    - "{topic} market forecast"
    - "{topic} key players market share"

  scope_modifiers:
    글로벌: ["global", "worldwide"]
    북미: ["North America", "US", "USA", "United States"]
    아시아: ["Asia Pacific", "APAC", "Korea", "Japan", "China"]
    유럽: ["Europe", "EU", "European"]

  purpose_queries:
    시장 진입 검토:
      - "{topic} market entry barriers"
      - "{topic} regulatory requirements"
    경쟁 분석:
      - "{topic} competitive landscape"
      - "{topic} market leaders"
    투자 판단:
      - "{topic} investment opportunity"
      - "{topic} growth potential risks"
