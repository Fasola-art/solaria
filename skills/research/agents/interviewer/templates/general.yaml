# General Research 인터뷰 템플릿
# 범용 리서치를 위한 기본 질문

template:
  name: general_research
  description: "범용 리서치를 위한 기본 인터뷰 템플릿"
  trigger_keywords: []  # 다른 템플릿에 매칭되지 않을 때 기본 사용
  is_default: true

# 핵심 질문
questions:
  # Q1: 리서치 목적
  purpose:
    question: "이 리서치의 목적은?"
    category: "purpose"
    priority: high
    options:
      - label: "의사결정"
        description: "특정 결정을 내리는 데 필요"
        output_format: "decision_report"
        follow_up: "어떤 결정을 내리려고 하시나요?"
      - label: "학습/이해"
        description: "주제에 대해 배우고 싶음"
        output_format: "overview_report"
      - label: "비교/평가"
        description: "여러 옵션을 비교하고 싶음"
        output_format: "comparison_report"
        redirect_template: "compare.yaml"
      - label: "문제 해결"
        description: "특정 문제의 해결책 필요"
        output_format: "solution_report"

  # Q2: 분석 깊이
  depth:
    question: "어떤 깊이의 분석을 원하시나요?"
    category: "depth"
    priority: high
    options:
      - label: "빠른 요약 (5분)"
        description: "핵심만 빠르게"
        depth_level: "quick"
        max_sources: 10
        max_react_cycles: 1
      - label: "표준 분석 (15분)"
        description: "균형 잡힌 분석"
        depth_level: "standard"
        max_sources: 30
        max_react_cycles: 2
      - label: "심층 리서치 (30분+)"
        description: "상세하고 포괄적인 분석"
        depth_level: "deep"
        max_sources: 50
        max_react_cycles: 4

  # Q3: 범위 제한
  scope:
    question: "특정 범위에 집중할까요?"
    category: "scope"
    priority: medium
    options:
      - label: "특정 지역"
        description: "지역 한정"
        type: "open_ended_follow"
        follow_up: "어떤 지역인가요? (예: 한국, 미국, 유럽)"
      - label: "특정 기간"
        description: "시간 범위 한정"
        type: "open_ended_follow"
        follow_up: "어떤 기간인가요? (예: 최근 1년, 2020-2024)"
      - label: "특정 산업/분야"
        description: "산업/분야 한정"
        type: "open_ended_follow"
        follow_up: "어떤 산업/분야인가요?"
      - label: "특별한 제한 없음"
        description: "폭넓게 조사"
        scope_modifier: ""

  # Q4: 배제 항목 (선택적)
  exclusions:
    question: "제외할 내용이 있나요?"
    category: "exclusion"
    priority: low
    optional: true
    type: "open_ended"
    placeholder: "예: 이미 알고 있는 내용, 특정 회사 제외 등"

  # Q5: 추가 키워드 (선택적)
  additional_keywords:
    question: "관련된 키워드나 용어가 더 있나요?"
    category: "keywords"
    priority: low
    optional: true
    type: "open_ended"
    placeholder: "예: 관련 용어, 특정 제품/서비스명 등"

# 기본값
defaults:
  purpose: "학습/이해"
  depth: "표준 분석 (15분)"
  scope: "특별한 제한 없음"

# 컨텍스트 템플릿
context_template: |
  이해한 내용:
  - 주제: {topic}
  - 목적: {purpose}
  - 깊이: {depth}
  {scope_line}
  {exclusions_line}
  {keywords_line}

  맞으시면 진행하겠습니다.

# 검색 전략 매핑
search_strategy:
  base_queries:
    - "{topic}"
    - "{topic} overview"
    - "{topic} guide"
    - "{topic} explained"

  purpose_queries:
    의사결정:
      - "{topic} decision making"
      - "{topic} pros cons"
      - "{topic} considerations"
    학습/이해:
      - "{topic} introduction"
      - "{topic} basics"
      - "{topic} how it works"
    문제 해결:
      - "{topic} solution"
      - "{topic} how to"
      - "{topic} fix"
      - "{topic} resolve"

  depth_modifiers:
    빠른 요약:
      breadth: 3
      search_count: 3
    표준 분석:
      breadth: 5
      search_count: 5
    심층 리서치:
      breadth: 8
      search_count: 8

# 출력 형식 매핑
output_formats:
  decision_report:
    sections:
      - "개요"
      - "주요 고려사항"
      - "옵션 분석"
      - "권고"

  overview_report:
    sections:
      - "개요"
      - "핵심 개념"
      - "주요 사실"
      - "추가 학습 자료"

  comparison_report:
    sections:
      - "비교 개요"
      - "비교표"
      - "장단점"
      - "상황별 추천"

  solution_report:
    sections:
      - "문제 정의"
      - "해결 방안"
      - "단계별 가이드"
      - "주의사항"

# 분야 자동 감지
domain_detection:
  patterns:
    health:
      keywords: ["건강", "질병", "증상", "치료", "의료"]
      template_hint: "health_disclaimer_required"
    finance:
      keywords: ["투자", "주식", "금융", "재테크"]
      template_hint: "finance_disclaimer_required"
    legal:
      keywords: ["법률", "소송", "계약", "권리"]
      template_hint: "legal_disclaimer_required"
    real_estate:
      keywords: ["부동산", "아파트", "전세", "매매"]
      redirect_template: null  # 전용 템플릿 없음, domain-sources 사용
