# 진행 상황 표시 시스템
# v3.0 - 안전장치 시스템

version: "3.0"
description: "리서치 진행 중 사용자에게 상태 표시"

# 핵심 목표
goals:
  - "사용자 대기 시간 체감 감소"
  - "진행 상황 투명성"
  - "예상 완료 시간 안내"

# 진행 단계 정의
progress_stages:
  - stage: "interview"
    name: "인터뷰"
    description: "주제 이해 및 요구사항 파악"
    weight: 0.05  # 전체 진행의 5%
    display:
      icon: "🎤"
      message: "요구사항을 파악하고 있습니다..."

  - stage: "planning"
    name: "계획 수립"
    description: "검색 전략 및 소스 선정"
    weight: 0.10  # 전체 진행의 10%
    display:
      icon: "📋"
      message: "검색 계획을 수립하고 있습니다..."

  - stage: "searching"
    name: "검색"
    description: "웹 검색 및 데이터 수집"
    weight: 0.40  # 전체 진행의 40%
    display:
      icon: "🔍"
      message: "관련 정보를 검색하고 있습니다..."
    substages:
      - name: "1차 소스 검색"
        weight: 0.60
      - name: "2차 소스 검색"
        weight: 0.30
      - name: "추가 검색"
        weight: 0.10

  - stage: "analyzing"
    name: "분석"
    description: "수집된 정보 분석 및 검증"
    weight: 0.25  # 전체 진행의 25%
    display:
      icon: "🔬"
      message: "수집된 정보를 분석하고 있습니다..."
    substages:
      - name: "신뢰도 평가"
        weight: 0.40
      - name: "교차검증"
        weight: 0.40
      - name: "분류"
        weight: 0.20

  - stage: "synthesizing"
    name: "종합"
    description: "결론 도출 및 보고서 작성"
    weight: 0.20  # 전체 진행의 20%
    display:
      icon: "📝"
      message: "결론을 정리하고 있습니다..."
    substages:
      - name: "핵심 발견 정리"
        weight: 0.50
      - name: "보고서 작성"
        weight: 0.40
      - name: "품질 검수"
        weight: 0.10

# 표시 형식
display_formats:
  # 진행률 바
  progress_bar:
    enabled: true
    style: "visual"
    template: |
      {icon} {stage_name}
      [{filled_bar}{empty_bar}] {percentage}%

    example: |
      🔍 검색 중
      [████████░░░░░░░░░░░░] 40%

  # 단계별 체크리스트
  checklist:
    enabled: true
    template: |
      {completed_icon} {stage_name}

    icons:
      completed: "✅"
      in_progress: "⏳"
      pending: "⬜"

    example: |
      ✅ 인터뷰 완료
      ✅ 계획 수립 완료
      ⏳ 검색 중... (3/5 소스)
      ⬜ 분석
      ⬜ 종합

  # 상세 상태
  detailed:
    enabled: true
    template: |
      ### 📊 리서치 진행 상황

      **현재 단계**: {current_stage}
      **진행률**: {overall_percentage}%
      **예상 완료**: {estimated_time}

      {stage_details}

# 실시간 업데이트
real_time_updates:
  # 업데이트 트리거
  triggers:
    - "단계 전환 시"
    - "주요 마일스톤 달성 시"
    - "소스 검색 완료 시"
    - "오류 발생 시"

  # 업데이트 빈도
  frequency:
    min_interval: "2초"
    max_interval: "30초"

# 시간 예측
time_estimation:
  # 기본 예상 시간
  base_estimates:
    quick:
      description: "빠른 검색"
      duration: "30초 ~ 1분"

    standard:
      description: "표준 리서치"
      duration: "2 ~ 5분"

    deep:
      description: "심층 분석"
      duration: "10 ~ 15분"

  # 조정 요소
  adjustment_factors:
    source_count:
      description: "검색 소스 수"
      impact: "+10초 per source"

    domain_complexity:
      description: "분야 복잡도"
      impact: "×1.0 ~ ×2.0"

    multi_domain:
      description: "다중 분야"
      impact: "+50% per additional domain"

  # 표시 형식
  display:
    template: "예상 완료: 약 {min_time} ~ {max_time}"
    example: "예상 완료: 약 3 ~ 5분"

# 오류 및 지연 표시
error_handling:
  # 지연 발생 시
  delay:
    threshold: "예상 시간 초과 20%"
    message: |
      ⏰ 예상보다 시간이 걸리고 있습니다.
      잠시만 더 기다려 주세요...

  # 부분 실패 시
  partial_failure:
    message: |
      ⚠️ 일부 소스에 접근할 수 없습니다.
      대체 소스로 진행하고 있습니다...

  # 재시도 중
  retry:
    message: |
      🔄 연결을 재시도하고 있습니다... ({retry_count}/3)

# 완료 표시
completion:
  success:
    icon: "✅"
    message: "리서치가 완료되었습니다!"
    stats: |
      📊 **리서치 요약**
      - 검색된 소스: {source_count}개
      - 분석된 페이지: {page_count}개
      - 소요 시간: {duration}

  partial_success:
    icon: "🟡"
    message: "리서치가 부분적으로 완료되었습니다."
    details: |
      ⚠️ 일부 정보가 누락되었을 수 있습니다.
      {missing_info}

# 에이전트 적용
agent_application:
  orchestrator:
    role: "진행 상황 추적 및 표시"
    actions:
      - "각 에이전트 상태 모니터링"
      - "진행률 계산"
      - "표시 업데이트 트리거"
      - "완료 시 요약 생성"

# 출력 템플릿
output_templates:
  inline_progress: |
    {icon} {message} [{percentage}%]

  stage_transition: |
    ✅ {completed_stage} 완료
    ⏳ {next_stage} 시작...

  final_summary: |
    ---
    ✅ **리서치 완료**

    | 단계 | 상태 | 소요 시간 |
    |------|------|----------|
    | 🎤 인터뷰 | 완료 | {interview_time} |
    | 📋 계획 수립 | 완료 | {planning_time} |
    | 🔍 검색 | 완료 | {searching_time} |
    | 🔬 분석 | 완료 | {analyzing_time} |
    | 📝 종합 | 완료 | {synthesizing_time} |

    **총 소요 시간**: {total_time}
    **검색된 소스**: {source_count}개
    ---
