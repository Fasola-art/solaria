# 교육/학습 분야 신뢰 소스
# v3.0 - 분야별 특화 검색 시스템

domain:
  id: education_learning
  name: "교육/학습"
  description: "온라인 강의, 자격증, 학습 로드맵 관련 리서치"

# 트리거 키워드
triggers:
  - "강의"
  - "수강"
  - "자격증"
  - "커리큘럼"
  - "온라인 학습"
  - "부트캠프"
  - "대학"
  - "공부"
  - "배우기"
  - "학습"

# 신뢰 소스 우선순위
sources:
  primary:
    - domain: "coursera.org"
      name: "Coursera"
      reliability: 5
      type: "MOOC"
      search_modifier: "site:coursera.org"

    - domain: "edx.org"
      name: "edX"
      reliability: 5
      type: "MOOC"
      search_modifier: "site:edx.org"

    - domain: "udemy.com"
      name: "Udemy"
      reliability: 4
      type: "마켓플레이스"
      search_modifier: "site:udemy.com"

    - domain: "kmooc.kr"
      name: "K-MOOC"
      reliability: 5
      type: "한국 MOOC"
      search_modifier: "site:kmooc.kr"

  secondary:
    - domain: "class101.net"
      name: "클래스101"
      reliability: 4
      type: "한국 클래스"
      search_modifier: "site:class101.net"

    - domain: "fastcampus.co.kr"
      name: "패스트캠퍼스"
      reliability: 4
      type: "부트캠프"
      search_modifier: "site:fastcampus.co.kr"

    - domain: "inflearn.com"
      name: "인프런"
      reliability: 4
      type: "IT 강의"
      search_modifier: "site:inflearn.com"

  tertiary:
    - domain: "YouTube 교육 채널"
      reliability: 3
    - domain: "블로그 학습 로드맵"
      reliability: 2

# 분야별 키워드
keywords:
  platforms:
    - Coursera
    - Udemy
    - edX
    - 인프런
    - 패스트캠퍼스

  types:
    - 무료
    - 유료
    - 자격증
    - 수료증
    - 학위

  topics:
    - 프로그래밍
    - 데이터사이언스
    - 디자인
    - 마케팅
    - 비즈니스

# 검색 전략
search_strategy:
  priority: ["공식 플랫폼", "리뷰", "로드맵"]
  time_filter: "최근 1년"
  cross_reference:
    - "공식 플랫폼"
    - "리뷰 사이트"

# 면책 조항
disclaimer:
  required: false

# 최신성 정책
freshness:
  max_age_days: 365
  warning_age_days: 180
  stale_label: "⚠️ 강의 내용이 업데이트되었을 수 있습니다"
