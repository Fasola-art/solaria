# 스타트업/비즈니스 분야 신뢰 소스
# v3.0 - 분야별 특화 검색 시스템

domain:
  id: startup_business
  name: "스타트업/비즈니스"
  description: "스타트업, 펀딩, M&A, 비즈니스 트렌드 관련 리서치"

# 트리거 키워드
triggers:
  - "스타트업"
  - "펀딩"
  - "시리즈"
  - "밸류에이션"
  - "투자"
  - "유니콘"
  - "IPO"
  - "M&A"
  - "VC"
  - "엑싯"

# 신뢰 소스 우선순위
sources:
  primary:
    - domain: "crunchbase.com"
      name: "Crunchbase"
      reliability: 5
      type: "데이터베이스"
      search_modifier: "site:crunchbase.com"

    - domain: "pitchbook.com"
      name: "PitchBook"
      reliability: 5
      type: "데이터베이스"
      search_modifier: "site:pitchbook.com"

    - domain: "cbinsights.com"
      name: "CB Insights"
      reliability: 5
      type: "분석"
      search_modifier: "site:cbinsights.com"

  secondary:
    - domain: "techcrunch.com"
      name: "TechCrunch"
      reliability: 4
      type: "뉴스"
      search_modifier: "site:techcrunch.com"

    - domain: "venturebeat.com"
      name: "VentureBeat"
      reliability: 4
      type: "뉴스"
      search_modifier: "site:venturebeat.com"

    - domain: "thevc.kr"
      name: "THE VC"
      reliability: 4
      type: "한국 스타트업"
      search_modifier: "site:thevc.kr"

    - domain: "platum.kr"
      name: "플래텀"
      reliability: 4
      type: "한국 스타트업 뉴스"
      search_modifier: "site:platum.kr"

  tertiary:
    - domain: "블로그/미디엄"
      reliability: 3

# 분야별 키워드
keywords:
  funding:
    - 펀딩
    - 시리즈 A/B/C
    - 시드
    - 프리A
    - 투자 유치

  metrics:
    - 밸류에이션
    - ARR
    - MRR
    - 런웨이
    - 번레이트

  events:
    - IPO
    - M&A
    - 엑싯
    - 피봇
    - 스케일업

# 검색 전략
search_strategy:
  priority: ["펀딩 정보", "회사 프로필", "투자자 정보"]
  time_filter: "최근 2년"
  cross_reference:
    - "Crunchbase"
    - "THE VC"
    - "뉴스"

# 면책 조항
disclaimer:
  required: false

# 최신성 정책
freshness:
  max_age_days: 180
  warning_age_days: 90
  stale_label: "⚠️ 스타트업 상황은 빠르게 변할 수 있습니다"
