# 분야 자동 감지 설정
# v3.0 - 키워드 기반 분야 감지 시스템

version: "3.0"
description: "사용자 질문에서 분야를 자동으로 감지하여 특화 검색 수행"

# 감지 설정
detection_config:
  min_keyword_match: 2       # 최소 2개 키워드 매칭 필요
  context_check: true        # 문맥 확인
  multi_domain_support: true # 다중 분야 지원
  fallback: "general"        # 감지 실패 시 범용 검색

# v5.2: Free API 연동
free_api_reference:
  config_path: "agents/searcher/config.yaml -> free_api.domain_mapping"
  source_ref: "references/free-api-sources.yaml"

