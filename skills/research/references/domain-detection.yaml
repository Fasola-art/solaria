# 다중 분야 처리
multi_domain_handling:
  strategy: "primary_plus_secondary"
  description: "두 분야가 겹칠 경우 두 분야 소스 모두 사용"

  examples:
    - query: "AI 주식"
      domains: ["ai_technology", "stocks_finance"]
      strategy: "merge_sources"

    - query: "부동산 투자"
      domains: ["real_estate", "stocks_finance"]
      strategy: "merge_sources"

    - query: "헬스케어 스타트업"
      domains: ["health_medical", "startup_business"]
      strategy: "merge_sources"

# 감지 점수 계산
scoring:
  primary_match: 3.0      # 주요 키워드 매칭
  secondary_match: 1.5    # 보조 키워드 매칭
  confidence_boost: 2.0   # 신뢰도 부스트 키워드
  threshold: 4.0          # 분야 확정 최소 점수

# 분야 우선순위 (충돌 시)
priority_order:
  - health_medical     # 면책 조항 필요
  - legal              # 면책 조항 필요
  - stocks_finance     # 면책 조항 필요
  - crypto_blockchain  # 면책 조항 필요
  - real_estate
  - ai_technology
  - startup_business
  - academic_papers
  - career_jobs
  - education_learning
  - shopping_reviews
  - travel_food
  - environment_esg

# 예외 처리
exceptions:
  # "코인 세탁기" → 암호화폐가 아님
  false_positive_prevention:
    crypto_blockchain:
      exclude_when:
        - "세탁기"
        - "게임 코인"
        - "동전"

    health_medical:
      exclude_when:
        - "건강한 코드"
        - "증상 재현"  # 개발 용어

  # 맥락 기반 재판단
  context_override:
    - pattern: "기술 트렌드"
      force_domain: "ai_technology"

    - pattern: "시장 점유율"
      force_domain: null  # 맥락에 따라 결정
